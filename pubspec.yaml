name: word_pods
description: テスト機能付き単語帳アプリ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # 画面遷移
  go_router: ^18.1.2

  # 状態管理
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.7

  # モデル
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # エラーハンドリング
  fpdart: ^1.2.0

  # Firebase
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  firebase_app_check: ^0.4.9
  google_sign_in: ^7.2.0
  # クラッシュ・非致命的エラーの収集と利用状況の分析（docs/high_level_design/crash_reporting.md）
  firebase_crashlytics: ^5.4.1
  firebase_analytics: ^12.6.1

  # 日付フォーマット
  intl: ^0.20.3

  # ローカルDB・ネットワーク監視
  sqflite: ^2.4.5
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  uuid: ^4.6.0

  # スプラッシュ画面
  flutter_native_splash: ^2.4.8

  # アプリアイコン生成
  flutter_launcher_icons: ^0.14.4
  cloud_functions: ^6.5.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # コード生成
  build_runner: ^2.16.2
  freezed: ^4.0.3
  riverpod_generator: ^4.0.9
  json_serializable: ^6.15.2
  go_router_builder: ^4.5.3

  # フォーマット
  flutter_lints: ^6.0.0

  # テスト
  mockito: ^5.8.1
  sqflite_common_ffi: ^2.4.5
  fake_cloud_firestore: ^4.4.0

# sqlite3 パッケージは、SQLite 本体を GitHub の Releases からダウンロードする。
# Linux（CI のテスト環境。sqflite_common_ffi が使う）では、ダウンロードせず OS の SQLite（libsqlite3.so）を使う
# （GitHub の障害でダウンロードがエラーページになり、CI のテストが動かなくなったため）。
# アプリ本体（iOS・Android）と macOS の開発環境は、今までどおりダウンロードした SQLite を使う
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3

flutter:
  # --flavor を省略したときは開発環境でビルドする
  default-flavor: dev
  uses-material-design: true
  assets:
    # アプリ内で表示する画像はスプラッシュ・ログイン画面のロゴだけ（他はアイコン生成の元画像なので同梱しない）
    - assets/images/android/android_icon_foreground_1024.png

flutter_native_splash:
  color: "#15203B"
  color_dark: "#15203B"
  image: assets/images/android/android_icon_foreground_1024.png
  ios: true
  android: true
  web: false
  android_12:
    color: "#15203B"
    color_dark: "#15203B"
    image: assets/images/android/android_icon_foreground_1024.png

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/images/ios/ios_app_icon_1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#15203B"
  adaptive_icon_foreground: "assets/images/android/android_icon_foreground_1024.png"
