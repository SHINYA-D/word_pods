name: CI/CD

# テスト（Flutter・Cloud Functions・Firestore ルール）がすべて通ったときだけ、main への push で dev → prod の順にデプロイする。
# デプロイを同じワークフローの後続ジョブにして、テストしたコミットそのものを出す
# （別ワークフローの workflow_run で起動すると、起動元の取り違えで未テストのコードを出すおそれがあるため）
on:
  push:
    branches:
      - '**'

# 外部のアクションはタグではなくコミット SHA で固定する（タグの付け替えで中身を差し替えられないようにするため）
# GITHUB_TOKEN はリポジトリを読むだけにする
permissions:
  contents: read

jobs:
  flutter:
    name: Flutter（analyze・test）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3

      - id: flutter-action
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}

      - name: Make .fvm/flutter_sdk
        env:
          FLUTTER_CACHE_PATH: ${{ steps.flutter-action.outputs.CACHE-PATH }}
        run: |
          mkdir -p .fvm
          ln -s "$FLUTTER_CACHE_PATH" .fvm/flutter_sdk

      # main.dart は dev / prod 両方の options を import するため、prod 側には dev のコピーを置く
      # （両ファイルのクラス名は同じ DefaultFirebaseOptions で、main.dart では as 付きで import している）
      - name: Decode firebase_options_dev.dart
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          mkdir -p lib/core/firebase/options
          printf '%s' "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/core/firebase/options/firebase_options_dev.dart
          cp lib/core/firebase/options/firebase_options_dev.dart lib/core/firebase/options/firebase_options_prod.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # テストから読み込まれないファイル（main.dart 等）のコンパイルエラーや lint 違反も検出する
      - name: Run static analysis
        run: flutter analyze

      # pubspec.yaml で、Linux では OS の SQLite（libsqlite3.so）を使う設定にしている。
      # ランナーのイメージに無い場合だけ入れる
      - name: Ensure system SQLite
        run: |
          if ! ldconfig -p | grep -q 'libsqlite3\.so '; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev
          fi

      - name: Run Widget Tests
        run: flutter test

  # Firestore ルールの書き間違い（誰でも読める等）や関数の不具合を、デプロイの前に止める
  functions:
    name: Cloud Functions・Firestore ルール（build・test）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # functions/package.json の engines.node と揃える
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Firestore のエミュレーターは Java 21 以上が必要
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools@15.34.2 # zizmor: ignore[adhoc-packages] バージョンを固定している

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      # TypeScript の型エラーを、デプロイのときではなくここで見つける
      - name: Build Cloud Functions
        run: npm --prefix functions run build

      # 関数の単体テストと、Firestore ルールのテスト（firestore_rules.test.ts）をエミュレーターで実行する
      - name: Run Cloud Functions and Firestore rules tests
        run: npm --prefix functions run test:emulator

  # テスト環境（dev）: Repository secrets を使う
  deploy-dev:
    name: デプロイ（dev）
    needs: [flutter, functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # デプロイを重ねて走らせない（後から来たものは前のものが終わるのを待つ）
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    # npm のパッケージはインストール時にスクリプトを実行できるため、インストールをすべて済ませてから認証する
    # （依存パッケージが乗っ取られていても、デプロイ用の鍵を読まれないようにするため）
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # functions/package.json の engines.node と揃える
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools@15.34.2 # zizmor: ignore[adhoc-packages] バージョンを固定している

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore Security Rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID"

      # Cloud Functions は Blaze プランが必要（dev・prod とも Blaze）
      - name: Deploy Cloud Functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID"

  # 本番環境（prod）: Environment「prod」の secrets（同名で本番の値）を使う
  # dev へのデプロイが成功したときだけ実行する。承認者は GitHub の Settings → Environments → prod で設定する
  deploy-prod:
    name: デプロイ（prod）
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    # インストールをすべて済ませてから認証する（deploy-dev と同じ理由）
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # functions/package.json の engines.node と揃える
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools@15.34.2 # zizmor: ignore[adhoc-packages] バージョンを固定している

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore Security Rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID"

      # Cloud Functions は Blaze プランが必要（dev・prod とも Blaze）
      - name: Deploy Cloud Functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID"
