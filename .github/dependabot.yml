# 依存パッケージ（アプリ・Cloud Functions）と GitHub Actions の更新を、週に1回 PR で届ける。
# 同じ種類の更新は1つの PR にまとめ、公開から7日たった版だけを提案する（公開直後に乗っ取られた版を避けるため）
#
# pub と npm は、大きなバージョンアップ（メジャー）を提案させない。
# メジャーはコードの書き直しを伴う（Riverpod 3・google_sign_in 7・Firebase の新しい版など）ため、
# マージするだけでは済まない。必要になったら専用のブランチで1つずつ手作業で上げる。
# groups の update-types は「どの更新を1つの PR にまとめるか」を決めるだけで、提案を止めないため、ignore で止める。
# 依存パッケージの既知の脆弱性は、OSV-Scanner（.github/workflows/security.yml）が別に検出する
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # 0.x の版は、Dependabot ではマイナー扱いでも互換性が壊れることがあるため、手作業で上げる
      # （firebase_app_check は firebase_core のメジャーと組で上がる）
      - dependency-name: firebase_app_check
        update-types: [version-update:semver-minor]
      - dependency-name: intl
        update-types: [version-update:semver-minor]
      # Firebase 5.x 系は、google_sign_in 7 と iOS の依存（gtm-session-fetcher）が衝突してビルドできないため止める。
      # 上の semver-major の指定はグループの PR では効かず、#9・#44 で提案されたため、バージョン範囲で明示する。
      # CI は iOS をビルドしないので、提案されると緑のまま通ってしまう。google_sign_in が対応したら外して手作業で上げる
      - dependency-name: firebase_core
        versions: ['>=5.0.0']
      - dependency-name: firebase_auth
        versions: ['>=7.0.0']
      - dependency-name: cloud_firestore
        versions: ['>=7.0.0']
      - dependency-name: cloud_functions
        versions: ['>=7.0.0']
      - dependency-name: firebase_app_check
        versions: ['>=0.5.0']
      # 4.5.0 以降は cloud_firestore 7 を必要とする
      - dependency-name: fake_cloud_firestore
        versions: ['>=4.5.0']
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions はメジャーも提案させる（ワークフローの書き換えはほぼ不要で、CI がそのまま確かめるため）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
